name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        run: |
          files=$(find . -type f \( -name '*.sh' -o -name 'sentinel.tmux' \) -not -path './.git/*')
          test -n "$files"
          shellcheck $files

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build with warnings as errors
        run: make clean && make CFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Engine contract
        run: |
          healthy=$(./bin/sentinel-status --simulate healthy)
          alert=$(./bin/sentinel-status --simulate alert)
          test -n "$healthy" && test -n "$alert"
          test "${healthy#${healthy%%[![:space:]]*}}" = "$healthy"
          test "${healthy%${healthy##*[![:space:]]}}" = "$healthy"
          test "${alert#${alert%%[![:space:]]*}}" = "$alert"
          test "${alert%${alert##*[![:space:]]}}" = "$alert"
          test "$(./bin/sentinel-status --simulate healthy)" = "$healthy"
          test "$(./bin/sentinel-status --simulate alert)" = "$alert"

  tmux-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install tmux and dependencies
        run: sudo apt-get update && sudo apt-get install --yes tmux shellcheck
      - name: Build engine
        run: make CFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Source generated config for every theme
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          tmux -L ci -f /dev/null start-server
          for palette in themes/*.palette; do
            stem=${palette##*/}; stem=${stem%.palette}
            tmux -L ci set-option -g @sentinel_theme "$stem"
            scripts/generate.sh
            conf="$XDG_CONFIG_HOME/tmux-sentinel/sentinel.conf"
            test -s "$conf"
            tmux -L ci -f /dev/null source-file "$conf" 2>stderr
            test ! -s stderr
          done
          tmux -L ci kill-server

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Compile Python modules
        run: python3 -m compileall cli/
      - name: Run pytest when present
        run: |
          if compgen -G 'test/test_*.py' > /dev/null || compgen -G 'test/*_test.py' > /dev/null; then
            python3 -m pytest test/
          else
            echo 'No pytest suite present; skipping.'
          fi
