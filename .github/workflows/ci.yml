name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        run: |
          files=$(find . -type f \( -name '*.sh' -o -name 'sentinel.tmux' \) -not -path './.git/*')
          test -n "$files"
          shellcheck $files

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build with warnings as errors
        run: make clean && make CFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Engine contract
        run: |
          healthy=$(./bin/sentinel-status --simulate healthy)
          alert=$(./bin/sentinel-status --simulate alert)
          test -n "$healthy" && test -n "$alert"
          test "${healthy#${healthy%%[![:space:]]*}}" = "$healthy"
          test "${healthy%${healthy##*[![:space:]]}}" = "$healthy"
          test "${alert#${alert%%[![:space:]]*}}" = "$alert"
          test "${alert%${alert##*[![:space:]]}}" = "$alert"
          test "$(./bin/sentinel-status --simulate healthy)" = "$healthy"
          test "$(./bin/sentinel-status --simulate alert)" = "$alert"

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install --yes tmux
          else
            brew install tmux
          fi
      - name: Compile Python modules
        run: python3 -m compileall -q cli/
      # The suite is stdlib unittest on purpose: CI needs nothing installed
      # beyond python3 and tmux. Every test isolates itself with a private
      # tmux socket and a scratch XDG_CONFIG_HOME.
      - name: Run the test suite
        run: make test
