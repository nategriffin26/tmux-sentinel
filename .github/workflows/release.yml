name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build ${{ matrix.arch }} binary
        run: |
          make clean
          make CC=clang CFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror -arch ${{ matrix.arch }}"
          mv bin/sentinel-status "bin/sentinel-status-darwin-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sentinel-status-darwin-${{ matrix.arch }}
          path: bin/sentinel-status-darwin-${{ matrix.arch }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build Linux x86_64 binary
        run: |
          make clean
          make CC=cc CFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'
          mv bin/sentinel-status bin/sentinel-status-linux-x86_64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sentinel-status-linux-x86_64
          path: bin/sentinel-status-linux-x86_64

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v7.0.1
        with:
          path: dist
      - name: Make release assets executable
        run: chmod +x dist/*/sentinel-status-*
      - name: Extract changelog notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          version="${tag#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*/sentinel-status-*
