name: Feature request
description: Suggest an improvement to tmux-sentinel
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this help you accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: platform
    attributes:
      label: Platform and tmux version
      placeholder: macOS 15 / tmux 3.4
