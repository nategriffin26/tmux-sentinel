# tmux-sentinel theme: Gruvbox Dark
# Description: Retro groove warmth with earthy organic tones

set -g status-style "bg=default,fg=#ebdbb2"

# Mode & Prefix indicator
set -g status-left "#[fg=#{?client_prefix,#fb4934,#{?pane_in_mode,#fabd2f,#83a598}}]▌#[fg=#ebdbb2,bold] #{=/18/…:session_name} #[default]"

# Chrome
set -g message-style "bg=#32302f,fg=#ebdbb2"
set -g message-command-style "bg=#32302f,fg=#fabd2f"
set -g mode-style "bg=#504945,fg=#ebdbb2"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
