# tmux-sentinel theme: Dracula
# Description: Famous dark gothic theme with vibrant saturated accents

set -g status-style "bg=default,fg=#f8f8f2"

# Mode & Prefix indicator
set -g status-left "#[fg=#{?client_prefix,#ff5555,#{?pane_in_mode,#ffb86c,#bd93f9}}]▌#[fg=#f8f8f2,bold] #{=/18/…:session_name} #[default]"

# Chrome
set -g message-style "bg=#282a36,fg=#f8f8f2"
set -g message-command-style "bg=#282a36,fg=#f1fa8c"
set -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
