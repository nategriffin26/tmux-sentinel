# tmux-sentinel theme: Catppuccin Latte
# Description: Clean, high-legibility light theme

set -g status-style "bg=#eff1f5,fg=#4c4f69"

# Mode & Prefix indicator
set -g status-left "#[fg=#{?client_prefix,#d20f39,#{?pane_in_mode,#df8e1d,#1e66f5}}]▌#[fg=#4c4f69,bold] #{=/18/…:session_name} #[default]"

# Chrome
set -g message-style "bg=#e6e9ef,fg=#4c4f69"
set -g message-command-style "bg=#e6e9ef,fg=#df8e1d"
set -g mode-style "bg=#ccd0da,fg=#4c4f69"
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"
