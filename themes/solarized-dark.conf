# tmux-sentinel theme: Solarized Dark
# Description: Precision color system designed for solar contrast

set -g status-style "bg=default,fg=#93a1a1"

# Mode & Prefix indicator
set -g status-left "#[fg=#{?client_prefix,#dc322f,#{?pane_in_mode,#b58900,#268bd2}}]▌#[fg=#93a1a1,bold] #{=/18/…:session_name} #[default]"

# Chrome
set -g message-style "bg=#002b36,fg=#93a1a1"
set -g message-command-style "bg=#002b36,fg=#b58900"
set -g mode-style "bg=#073642,fg=#93a1a1"
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#268bd2"
