# tmux-sentinel theme: Tokyo Night
# Description: Vibrant night theme inspired by Tokyo neon lights

set -g status-style "bg=default,fg=#c0caf5"

# Mode & Prefix indicator
set -g status-left "#[fg=#{?client_prefix,#f7768e,#{?pane_in_mode,#e0af68,#7aa2f7}}]▌#[fg=#c0caf5,bold] #{=/18/…:session_name} #[default]"

# Chrome
set -g message-style "bg=#24283b,fg=#c0caf5"
set -g message-command-style "bg=#24283b,fg=#e0af68"
set -g mode-style "bg=#3b4261,fg=#c0caf5"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
