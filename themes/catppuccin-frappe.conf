# tmux-sentinel theme: Catppuccin Frappé
# Description: Soft muted dark Catppuccin variant

set -g status-style "bg=default,fg=#c6d0f5"

# Mode & Prefix indicator
set -g status-left "#[fg=#{?client_prefix,#e78284,#{?pane_in_mode,#e5c890,#8caaee}}]▌#[fg=#c6d0f5,bold] #{=/18/…:session_name} #[default]"

# Chrome
set -g message-style "bg=#414559,fg=#c6d0f5"
set -g message-command-style "bg=#414559,fg=#e5c890"
set -g mode-style "bg=#51576d,fg=#c6d0f5"
set -g pane-border-style "fg=#414559"
set -g pane-active-border-style "fg=#8caaee"
